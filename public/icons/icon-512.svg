  />

  <!-- Wing Centerline Spine Highlight -->
  <path
    d="M256 116V278"
    stroke="#FFE3D1"
    stroke-width="14"
    stroke-linecap="round"
  />

  <!-- Precision Caliper Targeting Ring -->
  <circle cx="256" cy="235" r="70" stroke="rgba(255,255,255,0.25)" stroke-width="6" stroke-dasharray="12 12" fill="none"/>

  <!-- High-Tech Cyan Radar Beacon with Outer Glow -->
  <circle cx="256" cy="116" r="44" fill="#00F5D4" opacity="0.25"/>
  <circle cx="256" cy="116" r="32" fill="url(#pwa512-cyan)"/>
  <circle cx="256" cy="116" r="14" fill="#FFFFFF"/>
