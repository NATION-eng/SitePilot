<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pwa512-grad" x1="50" y1="50" x2="460" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9944"/>
      <stop offset="50%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#D94800"/>
    </linearGradient>
    <linearGradient id="pwa512-cyan" x1="200" y1="80" x2="420" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
    <filter id="pwa512-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="36" flood-color="#FF6B00" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Deep Architecture Dark Backdrop -->
  <rect width="512" height="512" rx="116" fill="#0A0E14"/>

  <!-- Radial Halo Accent -->
  <circle cx="256" cy="256" r="220" fill="#FF6B00" opacity="0.05"/>

  <!-- Isometric Hexagonal Structural Foundation Block -->
  <g filter="url(#pwa512-shadow)">
    <path
      d="M256 54L448 164.8V386.4L256 497.2L64 386.4V164.8L256 54Z"
      fill="#0D131D"
      stroke="url(#pwa512-grad)"
      stroke-width="18"
      stroke-linejoin="round"
    />
  </g>

  <!-- Precision Blueprint Structural Internal Tri-Axes -->
  <path
    d="M256 54V256M448 164.8L256 256M64 164.8L256 256M256 256V497.2"
    stroke="rgba(255, 255, 255, 0.16)"
    stroke-width="9"
    stroke-linecap="round"
  />

  <!-- Supersonic Pilot Navigation Arrowhead (Ascending) -->
  <path
    d="M256 116L384 342L256 278L128 342L256 116Z"
