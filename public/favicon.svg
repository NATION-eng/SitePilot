  <line x1="48" y1="6" x2="48" y2="58" stroke="rgba(255,255,255,0.06)" strokeWidth="0.8"/>
  <line x1="6" y1="22" x2="58" y2="22" stroke="rgba(255,255,255,0.06)" strokeWidth="0.8"/>
  <line x1="6" y1="36" x2="58" y2="36" stroke="rgba(255,255,255,0.06)" strokeWidth="0.8"/>
  <line x1="6" y1="50" x2="58" y2="50" stroke="rgba(255,255,255,0.06)" strokeWidth="0.8"/>
  <!-- SP Monogram -->
  <!-- S -->
  <path d="M14 23c0-1.7 1.3-3 3-3h6c1.7 0 3 1.3 3 3s-1.3 3-3 3h-6c-1.7 0-3 1.3-3 3s1.3 3 3 3h6" stroke="white" strokeWidth="2.8" strokeLinecap="round" fill="none"/>
  <!-- P -->
  <path d="M29 20v15" stroke="white" strokeWidth="2.8" strokeLinecap="round" fill="none"/>
  <path d="M29 20h5c2.2 0 4 1.8 4 4s-1.8 4-4 4h-5" stroke="white" strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round" fill="none"/>
