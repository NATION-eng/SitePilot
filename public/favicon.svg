  />

  <!-- Blueprint Facet Gridlines -->
  <path
    d="M32 6V32M56 19.8L32 32M8 19.8L32 32M32 32V61"
    stroke="rgba(255, 255, 255, 0.18)"
    stroke-width="1.8"
    stroke-linecap="round"
  />

  <!-- Supersonic Pilot Navigation Wing -->
  <path
    d="M32 14L48 42L32 34L16 42L32 14Z"
