<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fav-primary" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF8533"/>
      <stop offset="50%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#D94800"/>
    </linearGradient>
    <linearGradient id="fav-cyan" x1="26" y1="10" x2="54" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
  </defs>

  <!-- Deep Construction Blueprint Backdrop -->
  <rect width="64" height="64" rx="16" fill="#0A0E14"/>

  <!-- Outer Isometric Hexagonal Chassis -->
  <path
