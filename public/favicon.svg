    stroke-width="2.4"
    stroke-linecap="round"
  />

  <!-- Glowing Radar Beacon At Apex -->
  <circle cx="32" cy="14" r="4.2" fill="url(#fav-cyan)"/>
  <circle cx="32" cy="14" r="1.8" fill="#FFFFFF"/>
